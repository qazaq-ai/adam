[package]
name = "adam-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust audio primitives for the v6.3 phonemic-foundation arc. Provides PCM buffers, WAV I/O (hound), microphone capture / speaker playback (cpal), energy-based VAD, YIN F0 + speaker profiling, and a DSP stack (windowing, real-FFT, STFT spectrogram, Mel-filterbank MFCC). No C dependencies, no shell-out."

[dependencies]
thiserror.workspace = true
cpal = "0.15"
hound = "3.5"
rustfft = "6.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
