[package]
name = "adam-voice-repl-v6-3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Full v6.3 voice loop demonstrator — mic → DTW STT → phonotactic rescoring → Cyrillic → concatenative TTS → speaker. No Whisper, no `say`, pure Rust end-to-end. Standalone tool for sanity-checking the v6.3 stack before wiring it into `adam_chat`."

[[bin]]
name = "voice_repl_v6_3"
path = "src/main.rs"

[dependencies]
adam-audio = { path = "../../crates/adam-audio" }
adam-phoneme = { path = "../../crates/adam-phoneme" }
adam-stt-phoneme = { path = "../../crates/adam-stt-phoneme" }
adam-tts-phoneme = { path = "../../crates/adam-tts-phoneme" }
# Phase 16: dialog engine — turns recognised text into a response
# instead of echoing it back through TTS.
adam-dialog = { path = "../../crates/adam-dialog" }
adam-kernel-fst = { path = "../../crates/adam-kernel-fst" }
# Phase 17: voice-derived gender hint (F0 → male/female/child)
# so the dialog engine can address an unnamed speaker with the
# right Kazakh honorific («Ағай» / «Апай» / «Балам»).
adam-voice = { path = "../../crates/adam-voice" }
# Phase 15f: KB retrieval — load morpheme_index.json + world_core
# facts so factual queries like «Қазақстан туралы», «Абай кім»,
# «Алматы туралы» answer with curated knowledge instead of
# deflecting to «Бәлкім, X туралы айтасыз ба».
adam-retrieval = { path = "../../crates/adam-retrieval" }
adam-reasoning = { path = "../../crates/adam-reasoning" }
# Phase 15g.A: curated lexicon (~3000 canonical Kazakh wordforms,
# frequency-extracted from the v6_3 corpus) — feeds the fuzzy
# rescorer so OOV STT outputs like «көргері» can be re-mapped to
# the closest canonical surface form «көлдер» before reaching the
# dialog engine.
adam-lexicon-curated = { path = "../../crates/adam-lexicon-curated" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# cpal for probing the output device's preferred sample rate
# (we resample Piper output before playback — see synthesise_via_piper).
cpal = "0.15"
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
