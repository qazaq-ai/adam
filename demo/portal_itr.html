<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERG/ССГПО · ОТ/ТБ — дашборд ИТР</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cg stroke='%23e53935' stroke-width='45' stroke-linecap='round'%3E%3Cline x1='76' y1='76' x2='324' y2='324'/%3E%3Cline x1='137' y1='37' x2='363' y2='263'/%3E%3Cline x1='37' y1='137' x2='263' y2='363'/%3E%3Cline x1='76' y1='324' x2='324' y2='76'/%3E%3Cline x1='137' y1='363' x2='363' y2='137'/%3E%3Cline x1='37' y1='263' x2='263' y2='37'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#EBEEF0;--surface:#FBFCFD;--surface-2:#F1F3F5;--ink:#14181B;--ink-soft:#545C63;
    --ink-faint:#8A9299;--line:#D2D8DC;--line-strong:#B8C0C6;--accent:#B26E14;
    --verified:#1E8A5C;--verified-soft:#DBEEE4;--danger:#C13A34;--danger-soft:#F3DAD8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0E1113;--surface:#171B1E;--surface-2:#1E2327;--ink:#ECEFF1;--ink-soft:#9DA5AB;
    --ink-faint:#6B747B;--line:#272D32;--line-strong:#353D43;--accent:#E0A63F;
    --verified:#37B87F;--verified-soft:#16281F;--danger:#E6635C;--danger-soft:#2C1917;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-variant-numeric:tabular-nums}
  .bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar .in{max-width:72rem;margin:0 auto;padding:.7rem 1.4rem;display:flex;align-items:center;gap:.6rem}
  .logo{width:24px;height:24px;flex:none}
  .brand{font-family:var(--mono);font-weight:700;font-size:.9rem}
  .brand b{color:var(--accent)}
  .tag{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--ink-faint)}
  main{max-width:72rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
  h1{font-size:1.4rem;margin:.2rem 0 1.1rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:1.4rem}
  @media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--surface);padding:1rem 1.1rem}
  .stat .n{font-family:var(--mono);font-size:1.6rem;font-weight:700}
  .stat .l{font-size:.78rem;color:var(--ink-soft)}
  .stat .n.ok{color:var(--verified)} .stat .n.bad{color:var(--danger)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);font-size:.86rem}
  th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);background:var(--surface-2)}
  tr:last-child td{border-bottom:none}
  td.mono{font-family:var(--mono);font-size:.78rem;color:var(--ink-faint)}
  .pill{font-family:var(--mono);font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:5px}
  .pill.ok{color:var(--verified);background:var(--verified-soft)} .pill.bad{color:var(--danger);background:var(--danger-soft)}
  .v{font-family:var(--mono);font-size:.8rem} .v.y{color:var(--verified)} .v.n{color:var(--danger)}
  .empty{padding:2rem;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:.85rem}
  .live{margin-left:.5rem;font-family:var(--mono);font-size:.7rem;color:var(--verified)}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <svg class="logo" viewBox="0 0 400 400" aria-hidden="true"><g stroke="#e53935" stroke-width="45" stroke-linecap="round">
    <line x1="76" y1="76" x2="324" y2="324"/><line x1="137" y1="37" x2="363" y2="263"/><line x1="37" y1="137" x2="263" y2="363"/>
    <line x1="76" y1="324" x2="324" y2="76"/><line x1="137" y1="363" x2="363" y2="137"/><line x1="37" y1="263" x2="263" y2="37"/></g></svg>
  <span class="brand">ERG/ССГПО<b>·</b>ОТ/ТБ</span>
  <span class="tag">дашборд ИТР · движок ADAM<span class="live" id="live">● live</span></span>
</div></div>

<main>
  <h1>Журнал допусков</h1>
  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">всего протоколов</div></div>
    <div class="stat"><div class="n ok" id="s-adm">0</div><div class="l">допущено</div></div>
    <div class="stat"><div class="n bad" id="s-den">0</div><div class="l">не допущено</div></div>
    <div class="stat"><div class="n" id="s-ver">0</div><div class="l">подпись верна</div></div>
  </div>

  <div style="overflow-x:auto">
  <table id="tbl">
    <thead><tr>
      <th>Время</th><th>Работник</th><th>Табельный</th><th>Процедура</th>
      <th>Результат</th><th>Вердикт</th><th>Подпись</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">Ожидание протоколов… запустите adam_portal и пройдите инструктаж в кабинете работника.</td></tr></tbody>
  </table>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  async function poll() {
    let rows = [];
    try {
      const r = await fetch("/api/admissions");
      if (r.ok) rows = await r.json();
      $("live").textContent = "● live";
      $("live").style.color = "var(--verified)";
    } catch (e) {
      $("live").textContent = "○ нет связи";
      $("live").style.color = "var(--ink-faint)";
    }
    const total = rows.length;
    const adm = rows.filter(x => x.admitted).length;
    const ver = rows.filter(x => x.valid).length;
    $("s-total").textContent = total;
    $("s-adm").textContent = adm;
    $("s-den").textContent = total - adm;
    $("s-ver").textContent = ver;
    $("rows").innerHTML = total ? rows.slice().reverse().map(x => `
      <tr>
        <td class="mono">${x.issuanceDate || "—"}</td>
        <td>${esc(x.worker)}</td>
        <td class="mono">${esc(x.workerId) || "—"}</td>
        <td class="mono">${esc(x.procedure)}</td>
        <td class="mono">${x.passedCount}/${x.total}</td>
        <td><span class="pill ${x.admitted?'ok':'bad'}">${x.admitted?'допущен':'не допущен'}</span></td>
        <td><span class="v ${x.valid?'y':'n'}">${x.valid?'✓ верна':'✗ невалидна'}</span></td>
      </tr>`).join("")
      : `<tr><td colspan="7" class="empty">Пока нет протоколов.</td></tr>`;
  }
  function esc(s){return (s||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
