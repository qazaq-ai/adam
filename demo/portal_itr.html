<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERG/ССГПО · ОТ/ТБ — дашборд ИТР</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cg stroke='%23d27700' stroke-width='45' stroke-linecap='round'%3E%3Cline x1='76' y1='76' x2='324' y2='324'/%3E%3Cline x1='137' y1='37' x2='363' y2='263'/%3E%3Cline x1='37' y1='137' x2='263' y2='363'/%3E%3Cline x1='76' y1='324' x2='324' y2='76'/%3E%3Cline x1='137' y1='363' x2='363' y2='137'/%3E%3Cline x1='37' y1='263' x2='263' y2='37'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#EBEEF0;--surface:#FBFCFD;--surface-2:#F1F3F5;--ink:#14181B;--ink-soft:#545C63;
    --ink-faint:#8A9299;--line:#D2D8DC;--line-strong:#B8C0C6;--accent:#d27700;
    --verified:#1E8A5C;--verified-soft:#DBEEE4;--danger:#C13A34;--danger-soft:#F3DAD8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0E1113;--surface:#171B1E;--surface-2:#1E2327;--ink:#ECEFF1;--ink-soft:#9DA5AB;
    --ink-faint:#6B747B;--line:#272D32;--line-strong:#353D43;--accent:#E0A63F;
    --verified:#37B87F;--verified-soft:#16281F;--danger:#E6635C;--danger-soft:#2C1917;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-variant-numeric:tabular-nums}
  .bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar .in{max-width:72rem;margin:0 auto;padding:.7rem 1.4rem;display:flex;align-items:center;gap:.6rem}
  .logo{width:24px;height:24px;flex:none}
  .brand{font-family:var(--mono);font-weight:700;font-size:.9rem}
  .brand b{color:var(--accent)}
  .tag{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint)}
  .lang{margin-left:auto;font-family:var(--mono);font-size:.78rem;padding:.35rem .5rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink)}
  main{max-width:72rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
  h1{font-size:1.4rem;margin:.2rem 0 1.1rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:1.4rem}
  @media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--surface);padding:1rem 1.1rem}
  .stat .n{font-family:var(--mono);font-size:1.6rem;font-weight:700}
  .stat .l{font-size:.78rem;color:var(--ink-soft)}
  .stat .n.ok{color:var(--verified)} .stat .n.bad{color:var(--danger)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);font-size:.86rem}
  th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);background:var(--surface-2)}
  tr:last-child td{border-bottom:none}
  td.mono{font-family:var(--mono);font-size:.78rem;color:var(--ink-faint)}
  .pill{font-family:var(--mono);font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:5px}
  .pill.ok{color:var(--verified);background:var(--verified-soft)} .pill.bad{color:var(--danger);background:var(--danger-soft)}
  .v{font-family:var(--mono);font-size:.8rem} .v.y{color:var(--verified)} .v.n{color:var(--danger)}
  .dots{display:inline-flex;gap:3px;margin-left:.3rem;vertical-align:middle}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;cursor:help}
  .dot.ok{background:var(--verified)} .dot.bad{background:var(--danger)}
  .face{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line-strong);display:block;transform:scaleX(-1)}
  .idm{font-family:var(--mono);font-size:.9rem;color:var(--ink-faint)}
  .empty{padding:2rem;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:.85rem}
  .live{margin-left:.5rem;font-family:var(--mono);font-size:.7rem;color:var(--verified)}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <svg class="logo" viewBox="0 0 400 400" aria-hidden="true"><g stroke="#d27700" stroke-width="45" stroke-linecap="round">
    <line x1="76" y1="76" x2="324" y2="324"/><line x1="137" y1="37" x2="363" y2="263"/><line x1="37" y1="137" x2="263" y2="363"/>
    <line x1="76" y1="324" x2="324" y2="76"/><line x1="137" y1="363" x2="363" y2="137"/><line x1="37" y1="263" x2="263" y2="37"/></g></svg>
  <span class="brand">ERG/ССГПО<b>·</b>ОТ/ТБ</span>
  <span class="tag" id="tag"></span><span class="live" id="live">● live</span>
  <select id="lang" class="lang">
    <option value="ru">Русский</option>
    <option value="kk">Қазақша</option>
  </select>
</div></div>

<main>
  <h1 id="h1"></h1>
  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l" id="l-total"></div></div>
    <div class="stat"><div class="n ok" id="s-adm">0</div><div class="l" id="l-adm"></div></div>
    <div class="stat"><div class="n bad" id="s-den">0</div><div class="l" id="l-den"></div></div>
    <div class="stat"><div class="n" id="s-ver">0</div><div class="l" id="l-ver"></div></div>
  </div>

  <div style="overflow-x:auto">
  <table id="tbl">
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const I18N = {
    ru: {
      htmllang:"ru", tag:"дашборд ИТР · движок ADAM", h1:"Журнал допусков (годовая программа)",
      lTotal:"всего работников", lAdm:"допущено", lDen:"на пересдачу", lVer:"подпись верна",
      cols:["Время","Идент.","Работник","Табельный","Темы","Вопросы","Вердикт","Подпись"],
      live:"● live", noconn:"○ нет связи",
      wait:"Ожидание записей… запустите adam_portal и пройдите программу в кабинете работника.",
      none:"Пока нет записей.",
      admitted:"допущен", denied:"пересдача", retake:"до", sigOk:"✓ верна", sigBad:"✗ невалидна"
    },
    kk: {
      htmllang:"kk", tag:"ИТҚ дашбордысы · ADAM қозғалтқышы", h1:"Жіберу журналы (жылдық бағдарлама)",
      lTotal:"барлық қызметкер", lAdm:"жіберілді", lDen:"қайта тапсыруға", lVer:"қолтаңба дұрыс",
      cols:["Уақыт","Сәйкест.","Қызметкер","Табельдік","Тақырыптар","Сұрақтар","Шешім","Қолтаңба"],
      live:"● live", noconn:"○ байланыс жоқ",
      wait:"Жазбалар күтілуде… adam_portal іске қосып, қызметкер кабинетінде бағдарламадан өтіңіз.",
      none:"Әзірге жазба жоқ.",
      admitted:"жіберілді", denied:"қайта тапсыру", retake:"дейін", sigOk:"✓ дұрыс", sigBad:"✗ жарамсыз"
    }
  };
  let lang = "ru", T = I18N.ru, lastRows = [], hadConn = false;

  function applyLang(l){
    lang = (l === "kk") ? "kk" : "ru"; T = I18N[lang];
    document.documentElement.lang = T.htmllang;
    document.title = "ERG/ССГПО · ОТ/ТБ — " + T.h1;
    $("tag").textContent = T.tag;
    $("h1").textContent = T.h1;
    $("l-total").textContent = T.lTotal;
    $("l-adm").textContent = T.lAdm;
    $("l-den").textContent = T.lDen;
    $("l-ver").textContent = T.lVer;
    $("head").innerHTML = T.cols.map(c => `<th>${c}</th>`).join("");
    $("live").textContent = hadConn ? T.live : T.noconn;
    render();
  }

  function render(){
    const rows = lastRows, total = rows.length;
    const adm = rows.filter(x => x.admitted).length;
    const ver = rows.filter(x => x.valid).length;
    $("s-total").textContent = total;
    $("s-adm").textContent = adm;
    $("s-den").textContent = total - adm;
    $("s-ver").textContent = ver;
    $("rows").innerHTML = total ? rows.slice().reverse().map(x => {
      const dots = (x.topics||[]).map(t =>
        `<span class="dot ${t.admitted?'ok':'bad'}" title="${esc(t.title)}: ${t.passedCount}/${t.total}${t.valid?'':' · подпись невалидна'}"></span>`
      ).join("");
      const verdict = x.admitted
        ? `<span class="pill ok">${T.admitted}</span>`
        : `<span class="pill bad">${T.denied}${x.retakeAfter?` ${T.retake} ${x.retakeAfter}`:''}</span>`;
      return `
      <tr>
        <td class="mono">${x.issuanceDate || "—"}</td>
        <td>${x.proctorUrl
          ? `<a href="${x.proctorUrl}" target="_blank" title="camera-proctored"><img class="face" src="${x.proctorUrl}" alt="фото"></a>`
          : `<span class="idm" title="${esc(x.idMethod)}">${x.idMethod==='camera-proctored'?'📷':'—'}</span>`}</td>
        <td>${esc(x.worker)}</td>
        <td class="mono">${esc(x.workerId) || "—"}</td>
        <td class="mono">${x.topicsPassed}/${x.topicsTotal} <span class="dots">${dots}</span></td>
        <td class="mono">${x.questionsCorrect}/${x.questionsTotal}</td>
        <td>${verdict}</td>
        <td><span class="v ${x.valid?'y':'n'}">${x.valid?T.sigOk:T.sigBad}</span></td>
      </tr>`; }).join("")
      : `<tr><td colspan="8" class="empty">${hadConn?T.none:T.wait}</td></tr>`;
  }

  async function poll() {
    try {
      const r = await fetch("/api/admissions");
      if (r.ok) lastRows = await r.json();
      hadConn = true;
      $("live").textContent = T.live;
      $("live").style.color = "var(--verified)";
    } catch (e) {
      hadConn = false;
      $("live").textContent = T.noconn;
      $("live").style.color = "var(--ink-faint)";
    }
    render();
  }
  function esc(s){return (s||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
  $("lang").onchange = () => applyLang($("lang").value);
  applyLang("ru");
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
