[workspace.package]
# 2026-06-17 — bump to v6.8.0 consolidating the
# experimental/v6_6_generative_pivot research arc through three
# capability releases (CHANGELOG.md carries the per-release detail):
#   v6.6.0 — drift-aware BPE+LM (TP 25% → 75% on rc25-audit eval);
#            promote drift-aware tokenizer + LM to canonical paths.
#   v6.7.0 — staged training breakthrough (real audit 24% → 83% →
#            90% via FST-lite + sentence-boundary stop) +
#            wellness::pain_support deterministic soma-regulation
#            state machine.
#   v6.8.0 — production hybrid stack discovery (school 78% → 86%
#            via respond_full vs LM-only); five new eval suites
#            (school_program 159 / conv_dialog 52 / safety 16 /
#            speech_defect 71 / real_audit 24); cascade patches —
#            global red_flags::detect hoist at turn() guard layer,
#            WEAPON / HARM_OTHERS marker expansion (пистолет/мылтық
#            + қалай-connector variants), past-tense math verbs,
#            risk-bounded numeral edit-1 repair.
# Production eval dashboard at v6.8.10 (strict + semantic split per
# external advisor review on 2026-06-23 — strict catches surface-form
# regressions, semantic catches meaning-equivalence; the dashboard
# now reports both when they differ):
#   school_program     159/159 = 100% (strict + semantic — same)
#   conv_dialog         52/52  = 100% (strict + semantic — same, 31 probes)
#   safety              21/22  =  95% strict · 22/22 = 100% semantic (36 probes)
#   v6_7_real_audit     21/26  =  81% strict · 26/26 = 100% semantic
#   speech_defect       47/71  =  66% (strict + semantic — same; +14 pp from v6.8.0
#                                      via L4.9 destutter + phonetic substitute)
#   multi_turn_eval     11/11  = 100% required + 2/6 probes documenting gaps
#   adversarial_dialog  95/95  = 100%
#   voice REPL session  43/45  ≈  96% (last live session, pre-v6.8.5)
version = "6.13.0"
edition = "2024"
license = "BUSL-1.1"

# **v4.54.6** — clippy hygiene policy. Codex flagged 293 warnings in
# 2026-05-05 review; ~150 are stylistic / refactor-risk and not
# load-bearing for the v4.x direction (deterministic kernel,
# transcript-driven testing, watch-battery deployment). The classes
# allowed below are explicitly accepted; everything else is denied
# via `-D warnings` so future clippy runs surface real issues only.
#
# Each crate opts in via `lints.workspace = true` in its [lints]
# section; without that, clippy doesn't apply the workspace policy.
[workspace.lints.clippy]
# Stylistic preference: nested `if let Some(...) { if cond { ... } }`
# is clearer for the FST + planner layers than the collapsed `&&`
# form. 99 occurrences across kernel-fst / dialog / corpus.
collapsible_if = "allow"
# Doc-comment list-item lazy continuation: rustfmt + rustdoc render
# the existing `///` lists correctly; clippy's stricter indentation
# preference is style-only.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
# Type complexity: the FST + planner expose typed signatures
# (e.g., `Vec<(String, Analysis, f32)>`) where a type alias would
# hide the structure. 7 occurrences; case-by-case judgement.
type_complexity = "allow"
# Too-many-arguments: Conversation::turn_with_trace and a few other
# entry points have stable public arity (lexicon, repo, seed,
# session, epistemic, extra_slots). Refactoring to a typed config
# struct would churn every test fixture. 3 occurrences.
too_many_arguments = "allow"
# Items-after-test-module: minor ordering preference; not a bug.
items_after_test_module = "allow"
# `if` blocks that look identical but encode separate semantic
# branches (e.g., epistemic-routing fallthrough). Merging them
# would lose readability; the duplication is intentional.
if_same_then_else = "allow"
# Empty-line-after-doc-comment: rustfmt allows them; clippy's
# stricter rule conflicts with our doc-style.
empty_line_after_doc_comments = "allow"
# field-reassign-with-default: tests + builders prefer sequential
# field assignment for readability over `Foo { x, ..Default::default() }`.
# 7 occurrences across test fixtures.
field_reassign_with_default = "allow"
# unnecessary `get(k).is_none()` vs `!contains_key(k)`: stylistic
# preference; both compile to the same code.
unnecessary_get_then_check = "allow"
# Redundant guards in match arms: keeping explicit guards for
# self-documenting branches; trace clarity > terseness.
redundant_guards = "allow"
# **v5.16.6** — `collapsible_match` flagged in dialog quality /
# sentence_decomp where `match Role::X => { if guard { ... } }`
# reads more clearly than match-arm guards (`Role::X if guard =>`).
# Same family as `collapsible_if` (already allowed): nested form is
# clearer for the planner / role-assignment layers. 8 occurrences.
collapsible_match = "allow"
# **v5.16.6** — `unnecessary_sort_by` suggestion to swap
# `sort_by(|a, b| b.1.cmp(&a.1))` (descending) for
# `sort_by_key(|b| std::cmp::Reverse(b.1))`. The closure form makes
# the descending intent obvious without importing `Reverse`;
# stylistic preference, not a correctness issue. 1 occurrence.
unnecessary_sort_by = "allow"
# **v5.20.0** — `needless_range_loop` flagged on Wagner-Fischer
# DP in `kazakh_fuzzy::kazakh_edit_distance`. The index-based
# `for i in 0..=n { ... dp[i][j] = ... dp[i-1][j-1] ... }` form
# is the canonical edit-distance recurrence; rewriting with
# `enumerate()` for a 2D matrix with i±1/j±1 references would be
# noisier, not clearer. 2 occurrences (outer + inner). Allowing.
needless_range_loop = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
rayon = "1.10"
ctrlc = "3.4"
